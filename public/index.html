<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CastReel</title>
<style>
  :root { --bg: #0f1012; --panel: #17191c; --line: #2a2d32; --text: #ecebe8; --dim: #8d8f94; --accent: #e8b05a; --good: #5ec28a; --bad: #e0675f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }

  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  h1 { margin: 0; font-size: 20px; white-space: nowrap; }
  h1 span { color: var(--accent); }
  #mock { font-size: 11px; background: var(--bad); color: #fff; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 6px; }
  #pipe { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex: 1; }
  #pipe li { flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; position: relative; min-width: 0; }
  #pipe li:not(:last-child)::after { content: '→'; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); color: var(--dim); }
  #pipe b { display: block; font-size: 13px; }
  #pipe small { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  #pipe li.run { border-color: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
  #pipe li.done { border-color: var(--good); }
  #pipe li.err { border-color: var(--bad); }
  @keyframes pulse { to { box-shadow: 0 0 12px -2px var(--accent); } }
  #count { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }

  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .bar h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .bar .meta { color: var(--dim); flex: 1; font-variant-numeric: tabular-nums; }

  #upload { display: grid; place-items: center; gap: 16px; padding-top: 8vh; }
  #drop { width: min(640px, 100%); aspect-ratio: 16 / 9; border: 2px dashed var(--line); border-radius: 16px; display: grid; place-content: center; text-align: center; gap: 6px; cursor: pointer; }
  #drop:hover, #drop.over { border-color: var(--accent); }
  #drop.locked { opacity: .35; cursor: not-allowed; }
  #drop strong { font-size: 20px; }
  #drop span { color: var(--dim); }
  #consent { display: flex; gap: 8px; align-items: center; max-width: 640px; }

  .media { position: relative; overflow: hidden; }
  .media img, .media video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .media.mocked::after { content: ''; position: absolute; inset: 0; background: var(--tint); mix-blend-mode: multiply; opacity: .35; pointer-events: none; }
  .ai::before { content: 'AI-generated'; position: absolute; top: 8px; right: 8px; z-index: 3; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #000a; color: #fff; pointer-events: none; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .tile { border-radius: 10px; overflow: hidden; background: var(--panel); border: 2px solid transparent; position: relative; aspect-ratio: 4 / 5; animation: land .35s ease-out; }
  .tile .media { height: 100%; }
  .tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 13px; background: linear-gradient(transparent, #000c); }
  .tile.pending { animation: shimmer 1.2s linear infinite; background: linear-gradient(90deg, var(--panel) 30%, #22252a 50%, var(--panel) 70%) 0 0 / 300% 100%; }
  .tile.err { display: grid; place-items: center; color: var(--bad); font-size: 12px; padding: 12px; text-align: center; }
  .tile:not(.pending):not(.err) { cursor: pointer; }
  .tile.picked { border-color: var(--accent); box-shadow: 0 0 0 3px #e8b05a44; }
  @keyframes land { from { transform: scale(.94); opacity: 0; } }
  @keyframes shimmer { to { background-position: -300% 0; } }

  .card-wrap { display: grid; place-items: center; min-height: 440px; }
  .card { position: relative; width: min(420px, 100%); background: var(--panel); border-radius: 16px; overflow: hidden; touch-action: none; user-select: none; cursor: grab; box-shadow: 0 20px 50px -20px #000; }
  .card .media { aspect-ratio: 4 / 5; pointer-events: none; }
  .card h3 { margin: 12px 16px 2px; }
  .card p { margin: 0 16px 14px; color: var(--dim); }
  .actions { display: flex; justify-content: center; gap: 16px; margin-top: 18px; }
  .actions button { padding: 12px 28px; font-size: 16px; }
  #nope:hover { border-color: var(--bad); }
  #like:hover { border-color: var(--good); }
  kbd { font-size: 11px; color: var(--dim); margin-left: 6px; }

  .screen { aspect-ratio: 16 / 9; max-height: 70vh; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #000; position: relative; }
  .screen .media { height: 100%; }
  .screen video { object-fit: contain; }
  .screen.loading::after { content: attr(data-loading); position: absolute; inset: 0; display: grid; place-items: center; background: #000a; z-index: 4; color: var(--accent); font-weight: 600; }
  .turn img { animation: turn 7s ease-in-out infinite alternate; }
  @keyframes turn { 0% { transform: scale(1.15) translateX(-5%); } 50% { transform: scale(1.3) translateX(0); } 100% { transform: scale(1.15) translateX(5%); } }
  #lineForm { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  #lineForm label { color: var(--dim); white-space: nowrap; }
  #edit { display: flex; gap: 8px; margin-top: 14px; }
  #edit input, #lineForm input { flex: 1; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chips button { padding: 5px 12px; font-size: 13px; border-radius: 99px; }
  #edits { color: var(--dim); margin: 12px 0 0; padding-left: 20px; }
  details { margin-top: 14px; color: var(--dim); font-size: 13px; }
  details p { margin: 6px 0; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: 90vw; background: var(--bad); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 10; }
</style>
</head>
<body>
<header>
  <h1>Cast<span>→</span>Reel<b id="mock" hidden>MOCK</b></h1>
  <ol id="pipe">
    <li data-node="nb2"><b>NB2 Lite</b><small>headshots</small></li>
    <li data-node="taste"><b>Taste engine</b><small>learns from swipes</small></li>
    <li data-node="omni"><b>Omni Flash</b><small>casting reel</small></li>
    <li data-node="lyria"><b>Lyria 3.5</b><small>score</small></li>
  </ol>
  <div id="count">0 images</div>
</header>

<main>
  <section id="upload">
    <label id="consent"><input type="checkbox"> This is me, or I have this person's permission to generate AI images, video and voice of them.</label>
    <label id="drop" class="locked">
      <input type="file" accept="image/jpeg,image/png,image/webp" hidden disabled>
      <strong>Drop a clear, front-facing photo</strong>
      <span>JPG / PNG / WebP · tick the consent box first</span>
    </label>
  </section>

  <section id="grid" hidden>
    <div class="bar">
      <h2></h2><span class="meta"></span>
      <button id="newPhoto">↺ New photo</button>
      <button id="toDeck" disabled></button>
      <button id="toReel" class="primary" disabled>Make casting reel →</button>
    </div>
    <div class="tiles"></div>
  </section>

  <section id="deck" hidden>
    <div class="bar">
      <h2>Love it or pass?</h2><span class="meta" id="learn"></span>
      <button id="refine" class="primary" disabled>Refine batch →</button>
    </div>
    <div class="card-wrap"><div class="card ai"></div></div>
    <div class="actions">
      <button id="nope">✕ Pass<kbd>←</kbd></button>
      <button id="like">♥ Love<kbd>→</kbd></button>
    </div>
  </section>

  <section id="reel" hidden>
    <div class="bar">
      <h2></h2><span class="meta"></span>
      <button id="slate">🎙 Record slate (8s)</button>
      <button id="playSlate" hidden>▶ Play slate</button>
      <button id="mute">🔊 Sound on</button>
      <button id="back">← Back to headshots</button>
    </div>
    <form id="lineForm">
      <label for="line">Audition line</label>
      <input id="line" maxlength="300" required>
      <button>🎬 Perform this line</button>
    </form>
    <div class="screen ai" data-loading="Rendering audition tape…"></div>
    <form id="edit">
      <input placeholder="Direct the take: “more intense”, “bigger smile”, “black & white”…" required>
      <button class="primary">Re-render</button>
    </form>
    <div class="chips">
      <button>More intense</button><button>Softer delivery</button><button>Bigger smile</button><button>Black &amp; white</button>
    </div>
    <ol id="edits"></ol>
    <details><summary>Prompts sent to the models</summary><p id="pOmni"></p><p id="pLyria"></p></details>
  </section>
</main>

<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
